<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ErasureX</title>
    <link rel="stylesheet" href="css/styles.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .auth-container {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }

        #error {
            color: #dc2626;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="logo">ErasureX</div>
    <div class="subtitle">Secure. Sanitize. Verify.</div>

    <div id="error"></div>

    <form id="loginForm">

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

    <div class="demo">
        <strong>Demo Login</strong><br>
        Email: demo@erasurex.com<br>
        Password: demo123
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const registeredUser = JSON.parse(
        localStorage.getItem("erasurexUser")
    );

    const validDemo =
        email === "demo@erasurex.com" &&
        password === "demo123";

    const validRegistered =
        registeredUser &&
        registeredUser.email === email &&
        registeredUser.password === password;

    if (validDemo || validRegistered) {

        localStorage.setItem("erasurexLoggedIn", "true");

        localStorage.setItem(
            "erasurexCurrentUser",
            email
        );

       window.location.href = "index.html";

    } else {

        document.getElementById("error").textContent =
            "Invalid email or password.";

    }

});
</script>

</body>
</html>
